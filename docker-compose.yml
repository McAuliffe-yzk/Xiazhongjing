services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8860:8860"
    environment:
      HOST: 0.0.0.0
      PORT: 8860
      XIANGZHONGJING_DATA_DIR: /data
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_API_BASE: ${DEEPSEEK_API_BASE:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      IMAGE_API_KEY: ${IMAGE_API_KEY:-}
      IMAGE_API_BASE: ${IMAGE_API_BASE:-https://api.openai.com}
      IMAGE_MODEL: ${IMAGE_MODEL:-gpt-image-2}
    volumes:
      - xiangzhongjing-data:/data
    restart: unless-stopped

  mcp:
    profiles: ["mcp"]
    build:
      context: .
      dockerfile: Dockerfile.mcp
    ports:
      - "8080:8080"
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8080
      XIANGZHONGJING_DATA_DIR: /data
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_API_BASE: ${DEEPSEEK_API_BASE:-https://api.deepseek.com}
      MCP_API_KEY: ${MCP_API_KEY:-}
    volumes:
      - xiangzhongjing-data:/data
    restart: unless-stopped

volumes:
  xiangzhongjing-data:
